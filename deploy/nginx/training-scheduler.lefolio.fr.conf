# training-scheduler.lefolio.fr — static SPA + Nest API on :3000
#
# After deploying this HTTP vhost, enable TLS + redirect with:
#   sudo certbot --nginx -d training-scheduler.lefolio.fr --redirect \
#     --non-interactive --agree-tos --register-unsafely-without-email
# Certbot will rewrite this file to add listen 443 ssl and HTTP→HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name training-scheduler.lefolio.fr;

    root /opt/training-scheduler/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
