# Catch-all: unknown Host / bare IP. Do not serve a real app here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        default_type text/plain;
        return 200 "Sandbox host for *.lefolio.fr experiments.\nSee https://training-scheduler.lefolio.fr\n";
    }
}
